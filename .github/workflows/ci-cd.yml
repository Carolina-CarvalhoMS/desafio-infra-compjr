name: CI/CD Pipeline - Comp Junior Infra

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: 1. Lint & Testes com Cobertura
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      MONGODB_URL: mongodb://127.0.0.1:27017/node-express-boilerplate-test
      JWT_SECRET: thisisasamplesecret
      JWT_ACCESS_EXPIRATION_MINUTES: 30
      JWT_REFRESH_EXPIRATION_DAYS: 30
      JWT_RESET_PASSWORD_EXPIRATION_MINUTES: 10
      JWT_VERIFY_EMAIL_EXPIRATION_MINUTES: 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

      - name: Executar Testes com Cobertura
        run: npm run coverage
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/node-express-boilerplate-test

      - name: Upload de artefato de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  gitleaks:
    name: 2. Análise de Segredos (Gitleaks)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: 3. Análise de Qualidade (SonarQube)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download de artefato de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Análise no SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy-scan:
    name: 4. Varredura de Segurança da Imagem (Trivy)
    runs-on: ubuntu-latest
    needs: [gitleaks, sonarcloud]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da Imagem Local para Scan
        run: docker build -t node-express-app:test .

      - name: Varredura com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'node-express-app:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  docker-build-push:
    name: 5. Build & Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/node-express-boilerplate:latest

  render-deploy:
    name: 6. Deploy Automatizado no Render
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Disparar Webhook do Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"